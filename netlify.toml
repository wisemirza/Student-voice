[build]
  publish = "public"
  functions = "netlify/functions"

[build.environment]
  NODE_VERSION = "22"
  AWS_LAMBDA_JS_RUNTIME = "nodejs22.x"
  NODE_ENV = "production"
  PUBLIC_BASE_URL = "https://studentvc.netlify.app"
  FIREBASE_PROJECT_ID = "studio-9101762883-d0a0e"
  FIREBASE_DATABASE_ID = "student-voice-db"

[functions]
  node_bundler = "esbuild"
  included_files = ["src/**", "schema/**"]

[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/api/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/privacy"
  to = "/privacy.html"
  status = 200

[[redirects]]
  from = "/privacy/"
  to = "/privacy.html"
  status = 200

[[redirects]]
  from = "/admin"
  to = "/admin.html"
  status = 200

[[redirects]]
  from = "/admin/"
  to = "/admin.html"
  status = 200
