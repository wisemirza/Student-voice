<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#F7F7F7" />
  <title>Admin · Student Voice</title>
  <link rel="icon" href="/icon.svg" type="image/svg+xml" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;family=Noto+Sans+SC:wght@400;500;600;700&amp;display=swap" />
  <link rel="stylesheet" href="/styles.css" />
  <script src="/theme.js"></script>
  <style>
    .admin-status-badge {
      display: inline-block;
      font-size: 0.72rem;
      font-weight: 700;
      padding: 0.12rem 0.5rem;
      border-radius: 999px;
      text-transform: uppercase;
    }
    .status-active { background: #ECFDF5; color: #065F46; }
    .status-hidden { background: #FFFBEB; color: #92400E; }
    .status-removed { background: #FEF2F2; color: #991B1B; }
    [data-theme="dark"] .status-active { background: #0E261C; color: #86EFAC; }
    [data-theme="dark"] .status-hidden { background: #2B210B; color: #FDE68A; }
    [data-theme="dark"] .status-removed { background: #2D161A; color: #FCA5A5; }
    .report-badge {
      display: inline-block;
      font-size: 0.72rem;
      font-weight: 700;
      padding: 0.12rem 0.5rem;
      border-radius: 999px;
      background: #FEF2F2;
      color: #991B1B;
    }
    [data-theme="dark"] .report-badge {
      background: #2D161A;
      color: #FCA5A5;
    }
    .reports-box {
      background: var(--bg-subtle);
      border: 1px solid var(--border-color);
      border-radius: 12px;
      padding: 0.65rem 0.8rem;
      margin: 0.55rem 0;
      font-size: 0.82rem;
    }
    .reports-box ul {
      margin: 0.3rem 0 0;
      padding-left: 1.1rem;
    }
    .admin-actions {
      display: flex;
      gap: 0.45rem;
      flex-wrap: wrap;
      margin-top: 0.65rem;
    }
    .admin-filter-pills {
      display: flex;
      gap: 0.4rem;
      overflow-x: auto;
      margin-bottom: 1rem;
      padding-bottom: 0.2rem;
    }
    .filter-pill {
      appearance: none;
      border: 1px solid var(--border-color);
      background: var(--bg-surface);
      color: var(--text-secondary);
      font-family: inherit;
      font-size: 0.8rem;
      font-weight: 600;
      padding: 0.35rem 0.75rem;
      border-radius: 999px;
      cursor: pointer;
      white-space: nowrap;
    }
    .filter-pill.active {
      background: var(--brand-primary);
      color: var(--brand-on-primary);
      border-color: var(--brand-primary);
    }
    .qr-preview {
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1rem;
      background: #FFFFFF;
      border: 1px solid var(--border-color);
      border-radius: var(--radius-md);
      margin-bottom: 0.9rem;
    }
    .qr-preview img {
      width: 200px;
      height: 200px;
      display: block;
    }
    .share-url-row {
      display: flex;
      gap: 0.5rem;
      margin-bottom: 0.65rem;
    }
    .login-card {
      max-width: 380px;
      margin: 2.5rem auto;
      background: var(--bg-surface);
      border: 1px solid var(--border-color);
      border-radius: 18px;
      padding: 1.4rem;
      box-shadow: var(--shadow-card);
    }
  </style>
</head>
<body>
  <header class="site-header">
    <div class="container header-inner">
      <div class="header-top-row">
        <div>
          <h1 class="app-title">Admin Console</h1>
          <p class="app-subtitle">Moderation &amp; QR Sharing</p>
        </div>
        <div class="header-controls">
          <button type="button" class="btn btn-primary btn-sm" id="admin-qr-btn" hidden>Share &amp; QR Code</button>
          <a href="/" class="btn btn-secondary btn-sm">Student View</a>
          <button type="button" class="btn btn-secondary btn-sm" id="admin-logout-btn" hidden>Sign Out</button>
        </div>
      </div>
    </div>
  </header>

  <main class="container">
    <div id="admin-banner" class="alert-banner" role="status" aria-live="polite" hidden>
      <span id="admin-banner-text"></span>
      <button type="button" class="alert-close" id="admin-banner-close" aria-label="Dismiss">×</button>
    </div>

    <!-- Login View -->
    <section id="admin-login-section" class="login-card" hidden>
      <h2 style="margin: 0 0 0.4rem; font-size: 1.15rem;">Moderator Sign In</h2>
      <p style="margin: 0 0 1rem; color: var(--text-muted); font-size: 0.85rem;">
        Enter your admin password to manage issues and access the QR code.
      </p>
      <form id="admin-login-form">
        <div class="form-group">
          <label class="form-label" for="admin-password-input">Password</label>
          <input type="password" id="admin-password-input" class="form-input" required autocomplete="current-password" />
        </div>
        <button type="submit" class="btn btn-primary" style="width: 100%;">Sign In</button>
      </form>
    </section>

    <!-- Authenticated Dashboard -->
    <section id="admin-dashboard-section" hidden>
      <div class="admin-filter-pills" id="admin-filter-bar" role="group">
        <button type="button" class="filter-pill active" data-filter="all">All</button>
        <button type="button" class="filter-pill" data-filter="reported">Reported</button>
        <button type="button" class="filter-pill" data-filter="active">Active</button>
        <button type="button" class="filter-pill" data-filter="hidden">Hidden</button>
        <button type="button" class="filter-pill" data-filter="removed">Removed</button>
      </div>

      <div id="admin-issues-list" class="issues-list"></div>
    </section>
  </main>

  <!-- Admin-Only Share & QR Modal -->
  <div id="admin-qr-modal" class="modal-backdrop" role="dialog" aria-modal="true" aria-labelledby="qr-modal-heading" hidden>
    <div class="modal-card">
      <div class="modal-header">
        <h2 class="modal-title" id="qr-modal-heading">Share with Students</h2>
        <button type="button" class="btn btn-secondary btn-sm" id="close-qr-modal-btn">Close</button>
      </div>
      <p style="margin: 0 0 0.85rem; font-size: 0.86rem; color: var(--text-secondary);">
        Show this QR code on lecture slides, posters, or cohort group chats so students can open Student Voice directly.
      </p>
      <div class="qr-preview">
        <img id="admin-qr-img" alt="Student Voice QR Code" />
      </div>
      <div class="share-url-row">
        <input type="text" id="admin-share-url" class="form-input" readonly aria-label="Share URL" />
        <button type="button" class="btn btn-primary btn-sm" id="admin-copy-url-btn">Copy</button>
      </div>
      <div style="text-align: right;">
        <a href="/api/admin/qrcode" download="student-voice-qr.svg" class="btn btn-secondary btn-sm">Download QR (SVG)</a>
      </div>
    </div>
  </div>

  <script src="/admin.js"></script>
</body>
</html>
